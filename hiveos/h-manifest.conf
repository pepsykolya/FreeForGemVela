# FreeForGem-VELA — see LICENSE
# HiveOS custom miner manifest (the miner binary is ./ffgv, started by h-run.sh)
# Installation URL: https://github.com/pepsykolya/FreeForGemVela/releases/download/v@VERSION@/ffgv-hive-@VERSION@.tar.gz
# (HiveOS takes the miner name ffgv-hive and the version from that file name; the archive holds the folder ffgv-hive/)
CUSTOM_NAME=ffgv-hive
CUSTOM_VERSION=@VERSION@
CUSTOM_ALGO=vela
CUSTOM_LOG_BASENAME=/var/log/miner/$CUSTOM_NAME/$CUSTOM_NAME
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/$CUSTOM_NAME/config.txt
# JSON stats API of the miner (h-stats.sh reads it)
FFGV_API_PORT=${FFGV_API_PORT:-4078}
